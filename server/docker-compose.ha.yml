# High-availability Z relay: a load balancer in front of N relay instances that
# share presence + the pending queue through a RAM-only Redis. Any instance can
# deliver to any connected client. Everything stays zero-knowledge and on-RAM.
#
#   docker compose -f docker-compose.ha.yml up --build --scale relay=3
#
# Clients connect to http(s)://<host>:8080 (put a TLS proxy in front for wss://).
services:
  redis:
    image: redis:7-alpine
    # RAM-only: no snapshotting, no append-only file — nothing hits disk.
    #
    # noeviction, like render.ha.yaml, and NOT allkeys-lru, which this file
    # ran until 2026-09-17: at maxmemory an LRU store evicts whole keys, and
    # a mailbox's bodies (qe:) can go while its list (q:) stays — an envelope
    # whose sender was already told "sent", silently gone, and every promise
    # PROTOCOL.md, DATA_MAP.md and R22 make about "never evicted" false for
    # anyone who ran the documented command line. With noeviction a full
    # store refuses a send (store_full; the sender's outbox keeps it and
    # retries) and still lets logins drain, so it heals; the relay counts
    # what a store that does evict leaves behind as z_body_missing_total.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    # No ports published: only the relays talk to it, over the internal network.

  relay:
    build: .
    read_only: true
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
      QUEUE_TTL_HOURS: "72"
    depends_on:
      - redis
    # No ports here — the load balancer fronts them. `--scale relay=N` to add more.

  lb:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.ha.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - relay
