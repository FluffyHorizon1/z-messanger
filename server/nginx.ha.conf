# Load balancer for the HA Z relay (open-source nginx).
#
# Docker's embedded DNS resolves the "relay" service name to the IPs of every
# scaled relay container. Using a variable in proxy_pass forces nginx to
# re-resolve per request via the resolver, so it spreads WebSocket upgrades
# across all instances. Because the instances share state via Redis, a client
# can land on ANY instance and still reach anyone.
worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;   # Docker embedded DNS
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;

    location / {
      set $z_backend "relay:8080";
      proxy_pass http://$z_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;   # keep idle WebSockets alive
      proxy_send_timeout 3600s;
    }
  }
}
