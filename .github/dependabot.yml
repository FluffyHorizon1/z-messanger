# Dependency updates for the Dart packages, the two Node services, and the
# GitHub Actions this repo pins. pqcrypto is ignored everywhere: it is
# pinned exactly at 0.4.1 in protocol/pubspec.yaml to match app/pubspec.lock,
# and those two must move together, not on a routine bump.
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pqcrypto

  - package-ecosystem: pub
    directory: /protocol
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pqcrypto

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /kt
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
