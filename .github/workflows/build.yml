name: build

# Builds installable artifacts for all four targets and runs the full test
# suite (relay + protocol + real-relay integration). Artifacts are attached to
# each run and, on a v* tag, published to a GitHub Release with SHA-256 sums.
#
# Release signing is opt-in via repository secrets — builds without them still
# succeed (Android falls back to the debug key; desktop ships unsigned). See
# docs/SIGNING.md for the secret names and how to generate each credential.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  test:
    name: Tests (relay + protocol + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install redis (enables the HA multi-instance relay test)
        run: |
          # The runner image ships a third-party Chrome apt repo, and it has
          # been failing to serve its index. `apt-get update` exits 100 if ANY
          # configured repo fails, so a broken repository we do not use took
          # down a step that only wants redis. Drop it (it is a .sources file
          # on 24.04, not a .list), and do not let a stale index from any other
          # third-party repo fail the job either — if redis genuinely cannot be
          # installed, the install below says so.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || true
          sudo apt-get install -y redis-server
      - name: Relay unit tests
        working-directory: server
        run: |
          npm install
          npm test
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Protocol + integration tests (through the real relay)
        working-directory: protocol
        run: |
          dart pub get
          dart test
      - name: ML-KEM vectors vs kyber-py (independent FIPS 203 implementation)
        run: |
          python3 -m pip install --quiet kyber-py==1.2.0
          python3 protocol/tool/verify_mlkem.py
      - name: ML-DSA vectors vs dilithium-py (independent FIPS 204 implementation)
        run: |
          python3 -m pip install --quiet dilithium-py==1.4.0
          python3 protocol/tool/verify_mldsa.py
      # The audit brief is the first document an external reviewer reads and
      # the one that rots fastest: it names files that get renamed, it misses
      # test suites added after it was written, and it states counts by hand.
      #
      # Disabled in e59e630 because the brief cited the residual-risk register
      # and DATA_MAP.md, which had not landed yet — a check that fails the
      # moment it arrives is one people learn to skip. Both landed in the
      # commit that re-enabled this, and it reports zero problems.
      - name: Audit brief still describes this repository
        run: python3 tool/check_audit_scope.py
      # The content digest published with each release rests on one claim:
      # signing an APK does not move it. This inserts a real APK signing block
      # and checks that it does not.
      - name: Reproducibility tool's own tests
        run: python3 tool/test_verify_reproducible.py
      # A tag build is the worst place to discover a job never checked the
      # repository out, because the version number is already spent. This
      # catches it on every push instead.
      - name: Every CI job that uses repo files checks one out
        run: python3 tool/check_workflow.py
      # 15.4: Play assesses accessibility separately from the 3.5 items. The
      # widget test covers the screens that stand up without a ChatService;
      # this covers every screen's source for controls that announce nothing.
      - name: Every icon button and image announces something
        run: python3 tool/check_a11y.py
      # 15.4: the string migration is screen by screen, so this holds the
      # screens already done to zero hardcoded strings and reports what is
      # left. A half-migrated file quietly gaining new literals is the way
      # this kind of work stalls.
      - name: No migrated screen has regressed to hardcoded strings
        run: python3 tool/check_l10n.py
      # 15.5: the GA checklist must not say READY while a criterion below it
      # says otherwise — that is the specific way a release checklist misleads.
      - name: The GA checklist matches the repository
        run: python3 tool/check_ga.py
      - name: App tests (incl. concurrency regression through the real relay)
        working-directory: app
        run: |
          flutter pub get
          flutter test
      - name: Theme screenshots (light + dark, rendered by screenshots_test.dart)
        uses: actions/upload-artifact@v4
        with:
          name: z-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn

  android:
    name: Android APK + AAB
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Configure release signing (skipped if secrets absent)
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > key.properties
            echo "Release signing configured (upload key)."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — building debug-signed."
          fi
      - working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release
      - name: 16 KB page-size alignment (Play requirement for Android 15+ targets)
        working-directory: app
        run: |
          tool/check_16k.sh build/app/outputs/flutter-apk/app-release.apk
          tool/check_16k.sh build/app/outputs/bundle/release/app-release.aab
      - name: Remove signing material
        if: always()
        working-directory: app/android
        run: rm -f app/upload-keystore.jks key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: z-android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab

  linux:
    name: Linux bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          # Same as the redis step: the runner image's third-party Chrome repo
          # has been failing its index, and apt-get update exits 100 if any
          # configured repo fails. Drop the repo we do not use and tolerate a
          # stale index — the install below is what actually has to succeed.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || true
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package tarball
        working-directory: app/build/linux/x64/release
        run: tar czf z-linux-x64.tar.gz -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: z-linux-x64
          path: app/build/linux/x64/release/z-linux-x64.tar.gz

  windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Code-sign (skipped if no cert secret)
        working-directory: app/build/windows/x64/runner/Release
        shell: pwsh
        env:
          WIN_CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WIN_CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WIN_CERT_B64) {
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_B64))
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Select-Object -Last 1
            & $tool.FullName sign /f cert.pfx /p $env:WIN_CERT_PW /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 zapp.exe
            Remove-Item cert.pfx
            Write-Host "Signed zapp.exe."
          } else {
            Write-Host "No WINDOWS_CERT_BASE64 secret — shipping unsigned (SmartScreen will warn)."
          }
      - name: Zip Windows build
        working-directory: app/build/windows/x64/runner/Release
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath z-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: z-windows-x64
          path: app/build/windows/x64/runner/Release/z-windows-x64.zip

  macos:
    name: macOS app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - name: Sign, notarize & zip (unsigned zip if no Apple secrets)
        working-directory: app/build/macos/Build/Products/Release
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=$(ls -d *.app | head -1)
          if [ -n "$APPLE_CERT_B64" ]; then
            echo "$APPLE_CERT_B64" | base64 -d > cert.p12
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import cert.p12 -k build.keychain -P "$APPLE_CERT_PW" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain >/dev/null
            codesign --deep --force --options runtime --timestamp \
              --sign "$APPLE_SIGN_IDENTITY" "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" z-macos.zip
            xcrun notarytool submit z-macos.zip --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" z-macos.zip
            rm -f cert.p12
            echo "Signed + notarized."
          else
            echo "No APPLE_CERT_BASE64 secret — shipping unsigned (Gatekeeper will warn)."
            ditto -c -k --sequesterRsrc --keepParent "$APP" z-macos.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: z-macos
          path: app/build/macos/Build/Products/Release/z-macos.zip

  # 14.1 established that two builds on the SAME machine in the SAME directory
  # are byte-identical. This job was meant to extend that across machines and
  # paths — and its first real run (2026-09-09) FAILED, which is a finding and
  # is recorded as such in REPRODUCIBLE_BUILDS.md and THREAT_MODEL.md (R16).
  #
  # The first version of this job varied the machine and the checkout path at
  # the same time, so its failure could not say which mattered. That is a
  # badly designed experiment, and the fix is to run three builds instead of
  # two and compare them in pairs:
  #
  #   a  runner 1, path `z`
  #   b  runner 2, path `z`      a vs b isolates the MACHINE
  #   c  runner 3, path `a-deliberately-much-longer-checkout-directory`
  #                              a vs c isolates the PATH
  #
  # The path arm is not idle curiosity: `libapp.so` embeds the absolute build
  # directory (verified — the Dart AOT snapshot carries
  # `file://<checkout>/app/.dart_tool/flutter_build/dart_plugin_registrant.dart`
  # as a source URI), so path-independence is not something this toolchain
  # gives for free even if it turns out not to be what broke the first run.
  #
  # The comparison ignores the APK signing block, for a reason about keys and
  # not the build: a machine that has never signed an Android build generates
  # its own debug key on first use, so fresh runners sign with different keys.
  reproducible:
    name: Reproducible build (${{ matrix.slot }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - slot: a
            dir: z
          - slot: b
            dir: z
          - slot: c
            dir: a-deliberately-much-longer-checkout-directory
          # d varies locale and timezone and nothing else — the last inputs
          # nobody had checked. All three runners above share en_US.UTF-8 and
          # UTC, so a leak there would have been invisible in every run so far.
          - slot: d
            dir: z
            tz: Australia/Eucla
            locale: fr_FR.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ matrix.dir }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build release APK
        working-directory: ${{ matrix.dir }}/app
        env:
          TZ: ${{ matrix.tz || 'UTC' }}
          LC_ALL: ${{ matrix.locale || 'C.UTF-8' }}
          LANG: ${{ matrix.locale || 'C.UTF-8' }}
        # No signing secrets on purpose: this job proves the APP is
        # reproducible, and it must run on pull requests, where secrets are
        # not available.
        run: |
          flutter pub get
          flutter build apk --release
      # Enough to tell a path difference from a machine difference without
      # downloading 80 MB and guessing: the build id is a hash of the linked
      # output, so if a/b agree and a/c differ, the path is the variable.
      - name: Fingerprint the native libraries
        working-directory: ${{ matrix.dir }}/app
        run: |
          mkdir -p /tmp/fp && cd /tmp/fp
          unzip -o -q "$GITHUB_WORKSPACE/${{ matrix.dir }}/app/build/app/outputs/flutter-apk/app-release.apk" 'lib/*' -d x
          for f in $(find x -name '*.so' | sort); do
            printf '%-44s %s  build-id=%s\n' "${f#x/lib/}" \
              "$(sha256sum "$f" | cut -c1-16)" \
              "$(readelf -n "$f" 2>/dev/null | awk '/Build ID/{print $3}')"
          done | tee "$GITHUB_WORKSPACE/fingerprint-${{ matrix.slot }}.txt"
          echo "--- embedded absolute build paths in libapp.so ---"
          strings -a x/lib/arm64-v8a/libapp.so \
            | grep -oE 'file:///[A-Za-z0-9_./-]+' | sort -u | head \
            | tee -a "$GITHUB_WORKSPACE/fingerprint-${{ matrix.slot }}.txt"
      # Stage both files in ONE flat directory before uploading. Given two
      # paths, upload-artifact roots the archive at their least common
      # ancestor and preserves the tree below it — so the previous version put
      # the APK at `repro-a/<checkout dir>/app/build/app/outputs/flutter-apk/`
      # while the fingerprint sat at the top level, and every compare step
      # died on "No such file: repro-a/app-release.apk". The fingerprints
      # still printed, which is the only reason that run told us anything.
      - name: Stage the artefact
        run: |
          mkdir -p out
          cp "${{ matrix.dir }}/app/build/app/outputs/flutter-apk/app-release.apk" out/
          cp "fingerprint-${{ matrix.slot }}.txt" out/
      - uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.slot }}
          path: out/

  reproducible-compare:
    name: Reproducible build — compare
    needs: reproducible
    runs-on: ubuntu-latest
    # No longer continue-on-error. The 2026-09-09 three-way run answered the
    # question this job was built to ask: `a` and `b` — two different runner
    # VMs, same checkout path — produced byte-identical native libraries,
    # build ids included, while `c` differed from `a` in exactly the six
    # libraries that are compiled during the build. The machine is not a
    # variable; the path is. So a failure here is news again, and news should
    # fail the build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: repro-a, path: repro-a }
      - uses: actions/download-artifact@v4
        with: { name: repro-b, path: repro-b }
      - uses: actions/download-artifact@v4
        with: { name: repro-c, path: repro-c }
      - uses: actions/download-artifact@v4
        with: { name: repro-d, path: repro-d }

      - name: Fingerprints side by side
        run: for s in a b c d; do echo "=== $s ==="; cat repro-$s/fingerprint-$s.txt; done

      # Cheap and decisive, and it runs before the 80 MB comparison so a
      # regression is named in the first ten seconds rather than the last.
      - name: Machine independence — a and b must fingerprint identically
        run: |
          if diff -u repro-a/fingerprint-a.txt repro-b/fingerprint-b.txt; then
            echo "OK: two runners, identical native libraries."
          else
            echo "::error::Two runners at the same path produced different"
            echo "::error::native libraries. Until 2026-09-09 this was an open"
            echo "::error::question (R16); it was answered 'the machine does not"
            echo "::error::matter'. If this fails, that answer has changed."
            exit 1
          fi

      # The path DOES matter, and this bounds how much. libapp.so is the Dart
      # AOT snapshot, which embeds the absolute build directory as a source
      # URI; libdartjni.so is compiled during the build and picks it up too.
      # Nothing else should. A seventh name appearing here means the leak has
      # spread and REPRODUCIBLE_BUILDS.md is understating it.
      - name: Path dependence — a vs c differs only where we have documented
        run: |
          paste -d' ' <(cut -d' ' -f1 repro-a/fingerprint-a.txt) \
                      <(awk '{print $2}' repro-a/fingerprint-a.txt) \
                      <(awk '{print $2}' repro-c/fingerprint-c.txt) 2>/dev/null \
            | awk '$2 != $3 && $1 != "" {print $1}' | sort > /tmp/differing.txt
          echo "differs between path 'z' and the long path:"; cat /tmp/differing.txt
          if grep -qvE '(libapp|libdartjni)\.so$' /tmp/differing.txt; then
            echo "::error::A library other than libapp.so/libdartjni.so is"
            echo "::error::path-dependent. The build-path leak has spread."
            grep -vE '(libapp|libdartjni)\.so$' /tmp/differing.txt
            exit 1
          fi
          echo "OK: bounded to the two libraries compiled during the build."

      # Australia/Eucla is UTC+08:45 — a quarter-hour offset, so a leaked
      # timestamp is off by a value no rounding hides. French locale for
      # decimal separators and month names.
      - name: Locale and timezone must not matter (a vs d)
        run: |
          if diff -u repro-a/fingerprint-a.txt repro-d/fingerprint-d.txt; then
            echo "OK: TZ and LC_ALL do not reach the build."
          else
            echo "::error::A different timezone or locale changed the build."
            echo "::error::That is a new finding — REPRODUCIBLE_BUILDS.md says"
            echo "::error::these were untested, not that they were safe."
            exit 1
          fi

      - name: Full APK, same path, different machine (a vs b)
        run: |
          python3 tool/verify_reproducible.py --ignore-signing-block \
            repro-a/app-release.apk repro-b/app-release.apk

      # Expected to differ, and reported rather than enforced: this is R16 as
      # a measurement, not a gate. See REPRODUCIBLE_BUILDS.md — a verifier is
      # told which path to build in, the way Debian records Build-Path.
      - name: Full APK, different path (a vs c) — expected to differ
        if: always()
        continue-on-error: true
        run: |
          python3 tool/verify_reproducible.py --ignore-signing-block \
            repro-a/app-release.apk repro-c/app-release.apk \
            || echo "Differs, as documented. The bound is checked above."

  relay-image:
    name: Relay Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relay image
        working-directory: server
        run: docker build -t z-relay:${{ github.sha }} .

  release:
    name: Attach artifacts + checksums to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos, reproducible-compare]
    # contents: write   — create the Release and upload its assets (the repo
    #                     default token is read-only and 403s the publish).
    # id-token: write   — 14.2: mint the short-lived OIDC token Sigstore uses
    #                     to sign provenance. Keyless: nothing to store, and no
    #                     signing key for anyone to steal or for us to lose.
    # attestations: write — record the attestation against the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # This job used to consist of nothing but downloads and uploads, so it
      # had no checkout — and the content-digest step below, which runs a
      # script out of tool/, failed on its first tagged build with "No such
      # file". Checkout must come BEFORE download-artifact: it cleans the
      # workspace before writing, so the other order deletes dist/.
      # Only tool/ is needed, so only tool/ is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tool
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect artifacts and compute SHA-256 sums
        run: |
          mkdir -p release
          # Drop the reproducibility evidence FIRST, before anything is copied.
          # Those jobs upload an `app-release.apk` of their own, signed with a
          # throwaway debug key, plus a fingerprint text file. Removing them
          # after the copy — as this step used to — let a debug-signed APK
          # land in `release/` under the same name as the real one and clobber
          # it, and shipped the fingerprints as release assets. It also named
          # repro-a and repro-b explicitly, so slot c was never removed at all.
          rm -rf dist/repro-*
          find dist -type f -exec cp {} release/ \;
          cd release
          sha256sum * | tee SHA256SUMS.txt
      # A hash of the signed APK is the one number a verifier CANNOT check:
      # reproducing it needs the release key, which is the whole point of not
      # publishing the release key. So publish the number they can check — a
      # digest over the zip entries only, which signing does not disturb.
      # `tool/test_verify_reproducible.py` proves that by inserting a real
      # signing block and watching the digest hold still.
      - name: Content digest — the number an outside rebuild can match
        run: |
          cd release
          if [ -f app-release.apk ]; then
            d=$(python3 ../tool/verify_reproducible.py --content-digest app-release.apk)
            {
              echo "# Content digest of app-release.apk: $d"
              echo "#"
              echo "# Unlike the SHA-256 above, this one is reproducible from source."
              echo "# It covers every zip entry — name, compression, CRC, bytes — and"
              echo "# not the APK signing block, so a local unsigned rebuild matches it."
              echo "#"
              echo "#   git clone https://github.com/FluffyHorizon1/z-messanger z"
              echo "#   cd z/app && flutter build apk --release"
              echo "#   python3 ../tool/verify_reproducible.py --content-digest \\"
              echo "#       build/app/outputs/flutter-apk/app-release.apk"
              echo "#"
              echo "# The directory must be named z — see docs/REPRODUCIBLE_BUILDS.md."
            } >> SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi
      # 14.2: SLSA build provenance — a signed statement of WHICH commit,
      # WHICH workflow and WHICH runner produced each of these bytes,
      # countersigned into Sigstore's public transparency log. A checksum only
      # says two files match; provenance says where the file came from, and
      # the log means we cannot quietly issue a different answer to one person
      # than to everybody else.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/*'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
