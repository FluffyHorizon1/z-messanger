# Render.com Blueprint — the Z transparency log (SELF_HOSTING.md, "Running
# the transparency log", option C; PROTOCOL.md §19; docs/adr/0006).
#
# Dashboard → New → Blueprint → this repo → Blueprint Path: render.kt.yaml.
# Render asks for KT_SEED on the way, because it is marked sync: false — it
# is the log's signing key, it never goes in this file or in git, and it is
# generated on your own machine (SELF_HOSTING.md, step 1) and pasted into
# that one field. Everything else is here.
#
# Unlike the relay, the log KEEPS STATE: every published device list, in an
# append-only file on the disk below. Two things follow from having a disk
# on Render — the service cannot scale past one instance (a log is one
# writer anyway) and a deploy restarts it rather than overlapping the old
# and new copies (a few seconds; clients retry). A free instance cannot
# carry a disk, so this costs the smallest paid instance plus the disk:
# about $7 a month plus $0.25/GB at 2026 prices.
#
# After the first deploy: read the public key off the service's logs ("z-kt:
# N entries, M labels; public key …") or GET /kt/v1/pub once; that is what
# the app is built to pin (KT_LOG_PUB). Then a custom domain
# (kt.zmessengers.com for the public one; the app's default) on this
# service's Settings → Custom Domains, the same way as the relay's.
services:
  - type: web
    name: z-kt
    runtime: docker
    dockerfilePath: ./kt/Dockerfile
    dockerContext: ./kt
    plan: starter               # a disk needs a paid instance
    region: frankfurt
    healthCheckPath: /health
    # Deploy at release tags from the dashboard (Manual Deploy), not on every
    # push to main: a log is a live system, and main moves many times a day.
    autoDeployTrigger: "off"
    disk:
      name: z-kt-data
      mountPath: /data          # = KT_DATA; entries.jsonl lives here
      # The disk is the bound, and nobody had multiplied the limits through
      # until 2026-09-14: at the protocol's 256 KiB value cap a publish is up
      # to 341 KB on disk, so this 1 GB held 3,069 of them — 102 minutes at
      # PUBLISH_PER_MIN, from account keys that cost nothing to mint, after
      # which every publish got a 500 until somebody grew the disk. The log
      # now accepts values only up to KT_MAX_VALUE_BYTES (below), refuses to
      # publish once free space is under KT_MIN_FREE_BYTES, charges a FIRST
      # publish from a new account against its own allowance, and reports
      # diskBytes / diskFreeBytes / full in /health. A maximum-size entry costs
      # about 44 KB on disk at KT_MAX_VALUE_BYTES, so the 50 GB below is
      # roughly 1.2 million of them above the floor and tens of millions of
      # ordinary ones; at PUBLISH_PER_MIN a flood from one address needs
      # something like a month and tens of thousands of minted accounts to
      # reach the floor, and reads carry on when it does. Those are the 1 GB
      # figures multiplied through, not fresh measurements. Watch
      # diskFreeBytes; grow this before it matters — entries never expire, by
      # design.
      # Render cannot shrink a disk: this must be >= what is mounted, or
      # applying the Blueprint is refused.
      sizeGB: 50
    envVars:
      - key: KT_SEED
        sync: false             # 64 hex characters, generated on your machine; asked for at creation
      - key: KT_DATA
        value: /data
      # Refuse to start if fewer than this many entries replay.
      #
      # The log records its last signed head beside its entries and will not
      # sign a smaller history than that head covers — but a disk that does
      # not mount takes the head file with it, and then the log comes up at
      # size 0, /health answers 200, and it begins signing a brand-new
      # history with the production key. Every client holding a head reads
      # that as a fork, which is permanent.
      #
      # This is the floor that survives a lost disk, because it is not on it.
      # It is a floor, not an expected size, so it stays true as the log
      # grows: set it once to a size the log has comfortably passed, and
      # raise it when convenient. 0 disables the check.
      - key: KT_MIN_SIZE
        value: "1"
      - key: KT_PORT
        value: "10000"          # Render routes to PORT, 10000 by default; bind exactly that
      - key: KT_HOST
        value: 0.0.0.0
      # Three gates. The per-address one is the TLS front's view of the
      # address, which behind Cloudflare is Cloudflare — one bucket for the
      # whole internet unless KT_CLIENT_IP_HEADER below says otherwise, which
      # is why the total gate exists and is the one that stops a flood.
      - key: PUBLISH_PER_MIN
        value: "30"             # per source address
      - key: PUBLISH_PER_MIN_TOTAL
        value: "120"            # every publish, whatever the source
      - key: PUBLISH_PER_ACCT_PER_DAY
        value: "20"             # per account key, charged after the signature verifies
      # The R22 shape, applied to the log: a flood needs ACCOUNTS, because
      # the per-account budget makes any one of them useless, and a first
      # publish from an account the log has never held is the event worth
      # charging. An account the log holds is never charged here.
      - key: PUBLISH_NEW_ACCOUNTS_PER_MIN
        value: "10"             # first publishes for never-seen accounts, in total
      # What THIS log accepts, under the protocol's 256 KiB maximum. A real
      # device list is ~1.1 KB sealed for three devices and ~15 KB for fifty;
      # 32 KiB is a hundred devices and eight times the entries per GB.
      - key: KT_MAX_VALUE_BYTES
        value: "32768"
      # Below this much free space the log answers publishes with 503
      # log_full and keeps serving reads, rather than meeting ENOSPC halfway
      # through a line. /health reports the numbers; alarm on diskFreeBytes
      # well above this.
      - key: KT_MIN_FREE_BYTES
        value: "67108864"       # 64 MiB
      # Set this to cf-connecting-ip ONLY once the service is reachable solely
      # through Cloudflare. A forwarded address is the caller's to choose
      # unless something in front overwrites it, and a limiter keyed on a
      # value the caller picks is worse than one keyed on a value they cannot.
      - key: KT_CLIENT_IP_HEADER
        value: ""               # empty: use the socket's address
