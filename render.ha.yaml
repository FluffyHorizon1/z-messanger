# Render.com Blueprint — the Z relay scaled out (SELF_HOSTING.md, "Scaling
# out"): several relay instances behind Render's own load balancer, sharing
# presence and the pending queue through a RAM-only Key Value instance
# (Valkey, Redis-compatible). A client can land on any instance and still
# reach anyone, and a relay redeploy no longer drops what is queued.
#
# Dashboard → New → Blueprint → this repo → Blueprint Path: render.ha.yaml
# (a separate file so the single-instance Blueprints built from render.yaml
# are untouched by this one, and vice versa).
#
# The Key Value instance holds exactly what process RAM held before: opaque
# ciphertext, presence, opaque push tokens — never plaintext, never keys.
# persistenceMode: off keeps it in RAM only; ipAllowList: [] keeps it off the
# public internet — the instances reach it over Render's private network, so
# every service here must be in the same region.
#
# Free instances cannot run more than one copy, so this costs money: two
# 0.5 CPU / 512 MB instances plus a 256 MB Key Value — about $24 a month at
# 2026 prices.
services:
  - type: keyvalue
    name: z-relay-kv
    plan: 256mb
    region: frankfurt
    persistenceMode: "off"      # nothing touches disk
    # When full, refuse rather than evict: a refused send fails loudly, stays
    # in the sender's outbox and is retried; an evicted queue is a message the
    # sender already believes delivered. (docker-compose.ha.yml chooses
    # allkeys-lru; see SELF_HOSTING.md for the trade-off.)
    maxmemoryPolicy: noeviction
    ipAllowList: []             # internal connections only

  - type: web
    name: z-relay-ha
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: 0.5c-512mb            # "Starter" until August 2026; free cannot scale
    region: frankfurt           # same as the Key Value, for the internal URL
    numInstances: 2
    healthCheckPath: /health
    # Deploy at release tags from the dashboard (Manual Deploy), not on every
    # push to main: a relay is a live system, and main moves many times a day.
    autoDeployTrigger: "off"
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: z-relay-kv
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: QUEUE_TTL_HOURS
        value: "72"
      # Lowered from the 64 MB default because the store above is 256 MB: at
      # the default, FOUR full mailboxes fill it, and a full store refuses
      # every sender (`store_full`) until someone drains one. 16 MB leaves
      # room for sixteen, which is the trade this deployment wants — a
      # mailbox that hits its cap refuses new envelopes loudly and the
      # senders' outboxes retry (PROTOCOL §12.4, R22), whereas a full store
      # is everyone's problem at once.
      - key: MAX_QUEUE_BYTES_PER_USER
        value: "16777216"
      # How many mailboxes may be CREATED a minute, per instance, across all
      # senders. The per-mailbox caps above bound what one recipient can be
      # made to hold; they cannot bound how many recipients exist, and a
      # sealed envelope may be sent to any well-shaped routing id from a
      # connection that never authenticated (§12.1). A flood's mailboxes have
      # no owner, so nobody ever drains them and the only floor is the 72-hour
      # TTL — which is why creating one is the thing that is rate-limited
      # rather than filling one. Raise it only if real first-contacts are
      # being refused; they retry on `store_full`, so a brief refusal costs a
      # delay rather than a message.
      - key: NEW_MAILBOX_PER_MIN
        value: "120"
      # The Play App Signing certificate fingerprint (SHA-256, colon-separated
      # upper-case hex), read out of Play Console -> Setup -> App integrity.
      # It is public — it is published verbatim at
      # /.well-known/assetlinks.json — but it is not in this repository
      # because only the account holder can read it, and a placeholder would
      # be a claim about which app owns zmessengers.com/i that nobody could
      # check. Unset, the route 404s and an invite link opens a chooser
      # instead of the app; set, Android verifies it on install. Two values,
      # comma-separated, during a key rotation.
      - key: ANDROID_CERT_SHA256
        sync: false
      # Render injects PORT and the relay binds it — do not set it.
      # INSTANCE_ID is deliberately unset: every instance derives its own.
