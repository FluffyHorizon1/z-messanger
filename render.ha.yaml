# Render.com Blueprint — the Z relay scaled out (SELF_HOSTING.md, "Scaling
# out"): several relay instances behind Render's own load balancer, sharing
# presence and the pending queue through a RAM-only Key Value instance
# (Valkey, Redis-compatible). A client can land on any instance and still
# reach anyone, and a relay redeploy no longer drops what is queued.
#
# Dashboard → New → Blueprint → this repo → Blueprint Path: render.ha.yaml
# (a separate file so the single-instance Blueprints built from render.yaml
# are untouched by this one, and vice versa).
#
# The Key Value instance holds exactly what process RAM held before: opaque
# ciphertext, presence, opaque push tokens, and the public introduction
# keys of 44.10 — never plaintext, never private keys.
# persistenceMode: off keeps it in RAM only; ipAllowList: [] keeps it off the
# public internet — the instances reach it over Render's private network, so
# every service here must be in the same region.
#
# Free instances cannot run more than one copy, so this costs money: two
# 0.5 CPU / 512 MB instances plus a 256 MB Key Value — about $24 a month at
# 2026 prices.
services:
  - type: keyvalue
    name: z-relay-kv
    plan: 256mb
    region: frankfurt
    persistenceMode: "off"      # nothing touches disk
    # When full, refuse rather than evict: a refused send fails loudly, stays
    # in the sender's outbox and is retried; an evicted queue is a message the
    # sender already believes delivered. (docker-compose.ha.yml chooses
    # allkeys-lru; see SELF_HOSTING.md for the trade-off.)
    maxmemoryPolicy: noeviction
    ipAllowList: []             # internal connections only

  - type: web
    name: z-relay-ha
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: 0.5c-512mb            # "Starter" until August 2026; free cannot scale
    region: frankfurt           # same as the Key Value, for the internal URL
    numInstances: 2
    healthCheckPath: /health
    # Deploy at release tags from the dashboard (Manual Deploy), not on every
    # push to main: a relay is a live system, and main moves many times a day.
    autoDeployTrigger: "off"
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: z-relay-kv
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: QUEUE_TTL_HOURS
        value: "72"
      # Lowered from the 64 MB default because the store above is 256 MB: at
      # the default, FOUR full mailboxes fill it, and a full store refuses
      # every sender (`store_full`) until someone drains one. 16 MB leaves
      # room for sixteen, which is the trade this deployment wants — a
      # mailbox that hits its cap refuses new envelopes loudly and the
      # senders' outboxes retry (PROTOCOL §12.4, R22), whereas a full store
      # is everyone's problem at once.
      - key: MAX_QUEUE_BYTES_PER_USER
        value: "16777216"
      # How many mailboxes may be CREATED a minute, per instance, across all
      # senders. The per-mailbox caps above bound what one recipient can be
      # made to hold; they cannot bound how many recipients exist, and a
      # sealed envelope may be sent to any well-shaped routing id from a
      # connection that never authenticated (§12.1). A flood's mailboxes have
      # no owner, so nobody ever drains them and the only floor is the 72-hour
      # TTL — which is why creating one is the thing that is rate-limited
      # rather than filling one. Raise it only if real first-contacts are
      # being refused; they retry on `store_full`, so a brief refusal costs a
      # delay rather than a message.
      - key: NEW_MAILBOX_PER_MIN
        value: "240"             # ADR 0036 Q3: a group of 128 adding members
      # How many introduction keys the relay keeps (44.10): public keys only,
      # checked under each mailbox's own key, in memory, served only to
      # connections that never authenticated. Full, the least recently
      # authenticated is forgotten for a new one. 20 000 is the code's own
      # default (server.js, `ikeyCap`), named here so it is a decision on
      # record rather than a number nobody chose; memory is its only cost.
      - key: IKEY_CAP
        value: "20000"
      # The names this relay answers to, and the ONLY names a v2 login
      # signature is verified against since phase 29 (server.js,
      # `authorities`; P1-16). Not the Host header a connection presents —
      # whoever opens the socket chooses that — so every name clients dial
      # must be listed, matched exactly: `zmessengers.com` does not cover
      # `www.zmessengers.com`, nor the other way round, and a missing name
      # refuses every client that dials it with `bad_auth`, at once, whatever
      # app version they run. This line is load-bearing, permanently.
      #
      # The app's default relay address is wss://www.zmessengers.com
      # (app/lib/core/relay_url.dart), so `www.` is what almost every client
      # signs. The apex stays because onboarding wrote it into the vault of
      # every install made before 2026-09-17 and no app release can reach the
      # ones that never update: `zmessengers.com` answers 301 -> www, the
      # client follows it, and signs the apex it dialled. Removing either name
      # locks those users out silently.
      #
      # On 2026-10-15 the 4.0.1 relay was deployed with the apex alone here:
      # every login was `bad_auth` until `www.` was added. The relay now prints
      # the names it accepts at boot ("v2 authentication verified against:")
      # and, on a refusal that dialled a name missing from this list, that
      # name, quoted, with the list — read the deploy log before and after.
      - key: RELAY_AUTHORITIES
        value: www.zmessengers.com,zmessengers.com
      # The bearer token /metrics requires (P1-14); unset, the route answers
      # 404 and the SLO alarms (docs/SLO.md) have nothing to read. Render
      # generates a random value at creation and keeps it; read it from the
      # dashboard into the scraper. Never a value in this file.
      - key: METRICS_TOKEN
        generateValue: true
      # The header the front sets to the real client address. SET
      # (2026-10-20), and written here rather than left to the dashboard so a
      # Blueprint sync cannot quietly put the empty string back and turn the
      # per-address limits off without anyone noticing.
      #
      # It rests on one condition, which this file cannot check: the origin
      # (this service's onrender.com address) must be reachable through
      # Cloudflare alone. A header on a connection that reached the origin
      # directly is the caller's to forge, and a limiter keyed on a value the
      # caller picks is worse than one keyed on a value they cannot. If that
      # origin is ever exposed again, this goes back to "" the same day.
      # Empty would mean the socket address, which behind Cloudflare is
      # Cloudflare — one shared bucket for the per-address limits (new
      # mailboxes' unowned bytes; new handle flags then paced by the store's
      # cap alone) while the global caps bound the flood. Same rule as
      # KT_CLIENT_IP_HEADER in render.kt.yaml.
      - key: CLIENT_IP_HEADER
        value: "cf-connecting-ip"
      # The Play App Signing certificate fingerprint (SHA-256, colon-separated
      # upper-case hex), read out of Play Console -> Setup -> App integrity.
      # It is public — it is published verbatim at
      # /.well-known/assetlinks.json — but it is not in this repository
      # because only the account holder can read it, and a placeholder would
      # be a claim about which app owns zmessengers.com/i that nobody could
      # check. Unset, the route 404s and an invite link opens a chooser
      # instead of the app; set, Android verifies it on install. Two values,
      # comma-separated, during a key rotation.
      - key: ANDROID_CERT_SHA256
        sync: false
      # Render injects PORT and the relay binds it — do not set it.
      # INSTANCE_ID is deliberately unset: every instance derives its own.
