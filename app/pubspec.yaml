name: zapp
description: "Z — zero-trust end-to-end encrypted messenger. Messages live only on your devices."
publish_to: 'none'
version: 2.5.7+52

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # E2E crypto core (the exact package verified by the headless test suite).
  z_protocol:
    path: ../protocol

  cryptography: ^2.7.0
  provider: ^6.1.2

  # Encrypted local vault.
  sqflite_common_ffi: ^2.3.3
  # 2.x pairs with sqlite3_flutter_libs (compiled from source on
  # Linux/Windows, bundled on Android/macOS) — no binary downloads at build.
  sqlite3: ">=2.4.0 <3.0.0"
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Contact exchange. mobile_scanner 7.x brings ML Kit 17.3 / CameraX 1.6,
  # whose native libraries are 16 KB-page aligned (a Play requirement for
  # Android 15+ targets; docs/play/CONSOLE_RECOMMENDATIONS.md).
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Attachments.
  file_picker: ^8.1.2

  # Voice messages (7.4): capture + inline playback. `record`'s Linux impl is
  # pure Dart and just_audio has no Linux native code, so the desktop CI
  # builds are unaffected; platforms without support degrade to a file card.
  record: ^7.1.1
  just_audio: ^0.10.6

  intl: ^0.20.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

  # App lock (7.8): fingerprint / face / device-PIN prompt. Android, iOS,
  # macOS and Windows Hello; no Linux implementation, so the feature is
  # hidden there and the Linux CI build is unaffected.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
