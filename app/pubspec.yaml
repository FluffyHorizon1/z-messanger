name: zapp
description: "Z — zero-trust end-to-end encrypted messenger. Messages live only on your devices."
publish_to: 'none'
version: 3.7.6+171

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # E2E crypto core (the exact package verified by the headless test suite).
  z_protocol:
    path: ../protocol

  cryptography: ^2.7.0
  provider: ^6.1.2

  # Encrypted local vault.
  sqflite_common_ffi: ^2.3.3
  # 2.x pairs with sqlite3_flutter_libs (compiled from source on
  # Linux/Windows, bundled on Android/macOS) — no binary downloads at build.
  sqlite3: ">=2.4.0 <3.0.0"
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Contact exchange. mobile_scanner 7.x brings ML Kit 17.3 / CameraX 1.6,
  # whose native libraries are 16 KB-page aligned — a Play requirement for
  # Android 15+ targets, checked on every build by app/tool/check_16k.sh.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Attachments.
  file_picker: ^8.1.2
  # Richer media (continuous-b): a camera + photo/video gallery picker, so
  # attaching a photo is not a trip through the generic file browser. Camera
  # capture is mobile-only (Android/iOS); on desktop image_picker falls back to
  # a file dialog, so the file picker above stays the desktop path. Picked media
  # rides the SAME sealed-attachment pipeline as any file — read into memory,
  # capped at maxAttachmentBytes, and the picker's plaintext copy deleted at
  # once — nothing new lands unencrypted.
  image_picker: ^1.1.2

  # Voice messages (7.4): capture + inline playback. `record`'s Linux impl is
  # pure Dart. just_audio has native backends on Android, iOS and macOS; on
  # Linux and Windows it had none, so playback there fell back to a notice +
  # Save. 24.1 registers a media_kit backend on those two platforms only
  # (`just_audio_media_kit`, opt-in per platform from main()). A note still
  # reaches the player as bytes over just_audio's loopback HTTP server — never a
  # plaintext file on disk (the vault invariant) — which is the same path macOS
  # already used. Where a build still has no backend the player shows a notice
  # and the message menu's Save action takes the note off the device.
  record: ^7.1.1
  just_audio: ^0.10.6
  # 24.1 desktop audio backend. media_kit itself is pulled transitively
  # (^1.2.0); only Linux and Windows native libs are added, so the Android, iOS
  # and macOS builds gain no new native code (and keep their native backends).
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9

  # 24.4: the app's own version at runtime, read from the platform bundle
  # (AndroidManifest / Info.plist), for the "you're behind" check. Reads what
  # the build already carries, so it cannot drift the way a hardcoded string
  # did ("1.0.0 for eighteen releases").
  package_info_plus: ^8.3.0

  intl: ^0.20.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

  # App lock (7.8): fingerprint / face / device-PIN prompt. Android, iOS,
  # macOS and Windows Hello; no Linux implementation, so the feature is
  # hidden there and the Linux CI build is unaffected.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
