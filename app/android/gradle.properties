# 14.1: 3 GB, not 8. The previous -Xmx8G exceeded the total RAM of the machine
# this was measured on and the Gradle daemon was OOM-killed mid-build; 3 GB
# completes a full release build on an 8 GB machine. A build that only succeeds
# on a large developer workstation cannot be run by an outside verifier or a
# stock CI runner (typically 7 GB), and a verification nobody can perform
# verifies nothing. See docs/REPRODUCIBLE_BUILDS.md.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
