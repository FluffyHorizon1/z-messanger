name: z_protocol
description: >-
  End-to-end encryption core for the Z messenger: Ed25519/X25519 identities,
  X3DH-style handshake, Double Ratchet, XChaCha20-Poly1305 payloads,
  ML-KEM-768 post-quantum hybrid, encrypted attachments, safety numbers.
  Pure Dart, no Flutter dependency.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cryptography: ^2.7.0
  # ML-KEM-768 (FIPS 203) for the post-quantum hybrid (protocol v2). Pure
  # Dart, zero dependencies, MIT. Cross-checked byte-for-byte against kyber-py
  # and PQClean on seeded vectors (docs/vectors/v2/mlkem768.json).
  #
  # Pinned EXACTLY, to the version app/pubspec.lock ships. This package has no
  # lockfile of its own (pubspec.lock is not committed here), so a caret range
  # let CI resolve whatever 0.4.x was newest and test that instead of what
  # ships — 0.4.2 when this was written, whose lib/ happens to be identical to
  # 0.4.1's. The next one need not be. Move this and the app's lock together.
  pqcrypto: 0.4.1

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
